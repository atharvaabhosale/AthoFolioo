<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='assets/images/profile/favicon.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&family=Inter:wght@300;400;500&display=swap">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
</head>
<body class="bg-[#030303] text-white font-sans min-h-screen flex items-center justify-center p-5 antialiased">

  <div class="w-full flex items-center justify-center">

    <!-- Card -->
    <div class="bg-[#0a0a0a] border border-white/[0.08] rounded-[24px] p-8 sm:p-10 w-full max-w-[400px] shadow-[0_24px_60px_rgba(0,0,0,0.8),0_0_120px_rgba(255,255,255,0.02)] flex flex-col items-center">

      <!-- Logo mark -->
      <div class="w-14 h-14 rounded-2xl bg-transparent border border-white/20 flex items-center justify-center text-3xl font-display font-bold text-transparent [-webkit-text-stroke:1.5px_rgba(255,255,255,0.85)] tracking-tighter shadow-[inset_0_0_20px_rgba(255,255,255,0.05)] mb-5">
        <span>A</span>
      </div>

      <h1 class="text-2xl font-bold tracking-tight text-white mb-1.5 font-display text-center">Admin <span class="text-white/60">Portal</span></h1>
      <p class="text-sm text-white/50 mb-6 text-center">Sign in to manage your portfolio</p>

      <!-- Flash messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
          <div class="w-full p-3 rounded-lg text-xs font-medium flex items-center gap-2 mb-4 {% if category == 'success' %}bg-emerald-500/10 text-emerald-400 border border-emerald-500/25{% else %}bg-rose-500/10 text-rose-400 border border-rose-500/25{% endif %}">
            <i class="bi bi-{{ 'check-circle' if category == 'success' else 'exclamation-circle' }}"></i>
            <span>{{ message }}</span>
          </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <!-- Form -->
      <form method="POST" class="w-full flex flex-col gap-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="relative flex items-center w-full">
          <i class="bi bi-person absolute left-3.5 text-white/40 text-base pointer-events-none"></i>
          <input type="text" name="username" placeholder="Username" autocomplete="username" required
            class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-white/[0.08] bg-[#030303] text-white text-sm outline-none placeholder:text-white/40 focus:border-white focus:ring-2 focus:ring-white/10 transition-all">
        </div>

        <div class="relative flex items-center w-full">
          <i class="bi bi-lock absolute left-3.5 text-white/40 text-base pointer-events-none"></i>
          <input type="password" name="password" id="password" placeholder="Password" autocomplete="current-password" required
            class="w-full pl-10 pr-11 py-2.5 rounded-lg border border-white/[0.08] bg-[#030303] text-white text-sm outline-none placeholder:text-white/40 focus:border-white focus:ring-2 focus:ring-white/10 transition-all">
          <button type="button" class="absolute right-3 text-white/40 hover:text-white cursor-pointer bg-transparent border-0 p-1 flex items-center justify-center transition-colors" onclick="togglePass()">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </button>
        </div>

        <button type="submit"
          class="w-full mt-2 py-2.5 px-4 rounded-lg bg-white text-black font-semibold text-sm flex items-center justify-center gap-2 hover:bg-neutral-200 transition-all duration-200 shadow-[0_4px_16px_rgba(255,255,255,0.1)] active:scale-[0.98] cursor-pointer">
          Sign In <i class="bi bi-arrow-right"></i>
        </button>
      </form>

      <a href="{{ url_for('home') }}" class="mt-6 text-xs text-white/50 hover:text-white flex items-center gap-1.5 no-underline transition-colors">
        <i class="bi bi-arrow-left"></i> Back to site
      </a>
    </div>

  </div>

  <script>
    function togglePass() {
      const inp = document.getElementById('password');
      const ico = document.getElementById('eyeIcon');
      if (inp.type === 'password') {
        inp.type = 'text';
        ico.className = 'bi bi-eye-slash';
      } else {
        inp.type = 'password';
        ico.className = 'bi bi-eye';
      }
    }
  </script>
</body>
</html>
